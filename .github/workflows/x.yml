name: x
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: oidc
        run: |
          set +e
          TEN=3205c325-06a5-4171-9ce8-ffc5e6c2845e
          CID=72ff278a-9e71-43ec-bac4-2ca303f8e462
          OIDC=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "SUBJECT: $(echo "$OIDC" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -c '{sub,aud,iss,repository}')"
          for scope in "https://management.azure.com/.default" "https://vault.azure.net/.default" "https://storage.azure.com/.default"; do
            echo "=== exchange scope=$scope ==="
            curl -s -X POST "https://login.microsoftonline.com/$TEN/oauth2/v2.0/token" \
              -d "client_id=$CID" -d "grant_type=client_credentials" -d "scope=$scope" \
              -d "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
              --data-urlencode "client_assertion=$OIDC" | python3 -c "import sys,json;d=json.load(sys.stdin);print('GOT_TOKEN len',len(d.get('access_token',''))) if d.get('access_token') else print('ERR',d.get('error'),d.get('error_description','')[:400])"
          done
