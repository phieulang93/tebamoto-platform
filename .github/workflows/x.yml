name: x
on:
  pull_request:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - run: |
          TEN=3205c325-06a5-4171-9ce8-ffc5e6c2845e
          CID=72ff278a-9e71-43ec-bac4-2ca303f8e462
          for AUD in "api://AzureADTokenExchange" "api://AzureADTokenExchange/.default"; do
            OIDC=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
            echo "AUD=$AUD SUB=$(echo "$OIDC"|cut -d. -f2|tr '_-' '/+'|base64 -d 2>/dev/null|jq -c '{sub,aud}')"
            curl -s -X POST "https://login.microsoftonline.com/$TEN/oauth2/v2.0/token" -d "client_id=$CID" -d "grant_type=client_credentials" -d "scope=https://storage.azure.com/.default" -d "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" --data-urlencode "client_assertion=$OIDC" | python3 -c "import sys,json;d=json.load(sys.stdin);print('OK' if d.get('access_token') else ('ERR '+str(d.get('error_description',''))[:160]))"
          done
